name: Build MatheSnack (Android)

# Aufbau wie bei Drawmory. Läuft bei jedem Push und liefert immer ein
# Debug-APK zum Ausprobieren auf dem eigenen Handy. Sobald die vier
# Keystore-Secrets hinterlegt sind, kommen ein signiertes APK und ein AAB
# (für die Play Console) dazu. Ohne Secrets bleibt es beim Debug-APK.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ID: de.mathesnack.app
      APP_NAME: MatheSnack
      CORDOVA_CLI: '13.0.0'
      CORDOVA_ANDROID: '15.0.0'
      # Muss zu android-targetSdkVersion in der config.xml passen.
      TARGET_SDK: '36'

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Bewusst ganz vorne: Ein fehlerhafter Commit fällt auf, bevor das
      # Android-SDK geladen ist.
      - name: Prüfwerkzeuge installieren
        run: |
          set -e
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Prüfungen
        run: |
          set -e
          node validate.js
          python3 -m http.server 8765 > /dev/null 2>&1 &
          sleep 2
          node smoketest.js

      - name: Icons erzeugen
        run: |
          set -e
          python3 -m pip install --quiet --break-system-packages Pillow || pip install --quiet Pillow
          python3 make-icons.py

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # packages ausdrücklich setzen: Das veraltete Paket "tools" liefert
      # Google nicht mehr aus (Erfahrung aus FairMix).
      - name: Android SDK bereitstellen
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: SDK-Pakete für API ${{ env.TARGET_SDK }} nachziehen
        run: |
          set -e
          sdkmanager --install \
            "platforms;android-${TARGET_SDK}" \
            "build-tools;${TARGET_SDK}.0.0" \
            "platform-tools"

      - name: Cordova installieren
        run: npm install -g "cordova@${CORDOVA_CLI}"

      - name: Cordova-Projekt aufbauen
        run: |
          set -e
          cordova create build "$APP_ID" "$APP_NAME"
          cp config.xml build/config.xml
          mkdir -p build/res/android
          cp res/android/* build/res/android/

          # Die App steht vollständig in www/ (docs/ ist nur die Pages-Hinweisseite).
          rm -rf build/www/*
          cp -r www/. build/www/

          grep -o 'id="[^"]*"' build/config.xml | head -1
          grep -o '<name>[^<]*</name>' build/config.xml | head -1

          cd build
          cordova platform add "android@${CORDOVA_ANDROID}"
          cordova plugin ls
          cordova clean android

      - name: Erzeugtes Projekt bestätigen
        working-directory: build
        run: |
          set -e
          FEHLER=0
          if grep -rqE "(\"SDK_VERSION\"[[:space:]]*:[[:space:]]*${TARGET_SDK}|targetSdkVersion[[:space:]]*=?[[:space:]]*\"?${TARGET_SDK})" \
               platforms/android/cdv-gradle-config.json \
               platforms/android/app/build.gradle 2>/dev/null; then
            echo "Ziel-SDK ${TARGET_SDK} bestätigt."
          else
            echo "::error::Ziel-SDK ist nicht ${TARGET_SDK}. Play würde den Upload ablehnen."; FEHLER=1
          fi
          if cordova plugin ls | grep -q '^cordova-plugin-android-permissions'; then
            echo "Kamera-Erlaubnis: cordova-plugin-android-permissions installiert"
          else
            echo "::error::cordova-plugin-android-permissions fehlt – der Scanner bekäme keine Kamera."; FEHLER=1
          fi
          grep -q 'android.permission.CAMERA' platforms/android/app/src/main/AndroidManifest.xml \
            && echo "CAMERA im Manifest" \
            || { echo "::error::android.permission.CAMERA fehlt im Manifest (config.xml, config-file)."; FEHLER=1; }
          for P in cordova-plugin-purchase cordova-plugin-x-socialsharing cordova-plugin-customurlscheme; do
            cordova plugin ls | grep -q "^$P" && echo "Plugin $P installiert" || { echo "::error::Plugin $P fehlt."; FEHLER=1; }
          done
          # mathesnack://-Links (Knopf „In MatheSnack öffnen“ auf der Hinweisseite)
          grep -q 'android:scheme="mathesnack"' platforms/android/app/src/main/AndroidManifest.xml \
            && echo "URL-Schema mathesnack:// vorhanden" \
            || { echo "::error::URL-Schema mathesnack fehlt im Manifest."; FEHLER=1; }
          exit $FEHLER

      - name: Debug-APK bauen
        working-directory: build
        run: cordova build android --debug -- --packageType=apk

      - name: Kamera- und Kauf-Berechtigung im APK bestätigen
        working-directory: build
        run: |
          set -e
          AAPT2="$ANDROID_HOME/build-tools/${TARGET_SDK}.0.0/aapt2"
          APK=$(ls platforms/android/app/build/outputs/apk/debug/*.apk | head -1)
          "$AAPT2" dump permissions "$APK"
          "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.CAMERA' \
            || { echo "::error::Das APK fordert die Kamera nicht an – der Scanner bliebe schwarz."; exit 1; }
          # Ohne BILLING bliebe der Kaufknopf für das Lehrkraft-Paket wirkungslos.
          "$AAPT2" dump permissions "$APK" | grep -q 'com.android.vending.BILLING' \
            || { echo "::error::Das APK fordert com.android.vending.BILLING nicht an – In-App-Kauf wäre wirkungslos."; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/MatheSnack-debug.apk"

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@v6
        with:
          name: MatheSnack-debug-apk
          path: MatheSnack-debug.apk
          if-no-files-found: error

      # ---- Signierter Release-Build für den Play Store ----
      # Vier Repository-Secrets, mit einem EIGENEN Keystore für MatheSnack
      # (nicht dem von Drawmory – Play verknüpft Schlüssel und Kennung dauerhaft):
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Keystore entschlüsseln
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "vorhanden=false" >> "$GITHUB_OUTPUT"
            echo "Kein Keystore hinterlegt – Release-Build wird übersprungen."
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | sed '1s/^\xEF\xBB\xBF//' | tr -d ' \t\r\n' \
            | base64 -d > "$RUNNER_TEMP/mathesnack.keystore"
          if [ ! -s "$RUNNER_TEMP/mathesnack.keystore" ]; then
            echo "::error::Der Keystore ließ sich nicht dekodieren. ANDROID_KEYSTORE_BASE64 erneut einfügen."
            exit 1
          fi
          echo "vorhanden=true" >> "$GITHUB_OUTPUT"

      - name: Signiert bauen (APK zum Testen und AAB für den Store)
        if: steps.keystore.outputs.vorhanden == 'true'
        working-directory: build
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          for name in STORE_PW KEY_ALIAS KEY_PW; do
            eval "wert=\$$name"
            [ -n "$wert" ] || { echo "::error::Secret für $name fehlt oder ist leer."; exit 1; }
          done
          cat > build.json <<JSON
          {
            "android": {
              "release": {
                "keystore": "$RUNNER_TEMP/mathesnack.keystore",
                "storePassword": "$STORE_PW",
                "alias": "$KEY_ALIAS",
                "password": "$KEY_PW",
                "keystoreType": "pkcs12"
              }
            }
          }
          JSON
          cordova build android --release -- --packageType=apk
          cordova build android --release -- --packageType=bundle
          rm -f build.json

      - name: Signatur und Kennung bestätigen
        if: steps.keystore.outputs.vorhanden == 'true'
        working-directory: build
        env:
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/${TARGET_SDK}.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/${TARGET_SDK}.0.0/aapt2"
          APK=$(ls platforms/android/app/build/outputs/apk/release/*.apk | head -1)
          KENNUNG=$("$AAPT2" dump packagename "$APK")
          echo "Kennung: $KENNUNG"
          [ "$KENNUNG" = "$APP_ID" ] || { echo "::error::Kennung ist $KENNUNG, erwartet $APP_ID."; exit 1; }
          AUS_APK=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -i -m1 "certificate SHA-256 digest" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          AUS_KEYSTORE=$(keytool -list -v -keystore "$RUNNER_TEMP/mathesnack.keystore" \
            -alias "$KEY_ALIAS" -storepass "$STORE_PW" \
            | grep -i -m1 "SHA256:" | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK:      $AUS_APK"
          echo "Keystore: $AUS_KEYSTORE"
          [ -n "$AUS_APK" ] && [ "$AUS_APK" = "$AUS_KEYSTORE" ] \
            || { echo "::error::Das APK wurde nicht mit dem erwarteten Schlüssel signiert."; exit 1; }

      - name: Signiertes APK hochladen
        if: steps.keystore.outputs.vorhanden == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: MatheSnack-release-apk
          path: build/platforms/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: AAB hochladen
        if: steps.keystore.outputs.vorhanden == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: MatheSnack-release-aab
          path: build/platforms/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/mathesnack.keystore"
