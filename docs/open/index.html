<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>MatheSnack</title>
<link rel="icon" href="../icon-192.png">
<!--
  Ziel aller QR-Codes: https://simaehlmann-cloud.github.io/MatheSnack/open/#s=CODE
  Ist MatheSnack installiert, öffnet iOS den Link direkt in der App (Universal
  Link). Sonst landet man hier: Hinweis auf die kostenlose App, Knopf
  „In MatheSnack öffnen“ (mathesnack://open#s=…, z. B. für Android), Code
  zum Abtippen. Gespielt wird hier bewusst nicht – nur in der App.
  Der Code hinter # wird nie an den Server übertragen.
-->
<style>
  :root { --paper:#FBF7EF; --grid:#EFE7D8; --card:#fff; --text:#1E2447; --muted:#636A8A; --ink:#2B3A9E; --line:#E3DACA; --accent:#FF6B2C; }
  @media (prefers-color-scheme: dark) { :root { --paper:#14182B; --grid:#1B2038; --card:#1F2541; --text:#EEF0FA; --muted:#A4AACA; --ink:#9DAAFF; --line:#2F3762; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:calc(20px + env(safe-area-inset-top)) 16px 30px;
    background-color:var(--paper); color:var(--text);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size:26px 26px;
    font:17px/1.5 ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:480px; background:var(--card); border:2px solid var(--line); border-radius:24px; padding:26px 22px; text-align:center; }
  img { width:84px; height:84px; border-radius:20px; }
  h1 { margin:12px 0 6px; font-size:26px; }
  p { margin:8px 0; }
  .muted { color:var(--muted); font-size:15px; }
  .btn { display:block; width:100%; margin:12px 0 0; padding:15px 18px; border-radius:999px; font-weight:800; text-decoration:none; font-size:18px;
    border:2px solid var(--line); color:var(--text); background:var(--card); }
  .btn.primary { background:var(--ink); border-color:var(--ink); color:#fff; }
  @media (prefers-color-scheme: dark) { .btn.primary { color:#10142A; } }
  .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:24px; font-weight:800; letter-spacing:2px;
    border:2px dashed var(--line); border-radius:12px; padding:10px; margin:14px 0 4px; }
  .links { margin-top:18px; font-size:14px; }
  a { color:var(--ink); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <img src="../icon-192.png" alt="">
  <h1 id="title"></h1>
  <p id="sub"></p>
  <a class="btn primary" id="open" href="#"></a>
  <a class="btn" id="ios" hidden></a>
  <a class="btn" id="android" hidden></a>
  <p class="muted" id="soon" hidden></p>
  <div id="codeBox" hidden>
    <p class="muted" id="codeLabel"></p>
    <div class="code" id="code"></div>
  </div>
  <p class="links"><a id="privacy"></a> · <a id="imprint"></a></p>
</main>
<script>
"use strict";
/* Nach der Veröffentlichung hier die Store-Adressen eintragen. */
const APP_STORE_URL = "";
const PLAY_URL = "";

const TXT = {
  de: {
    title: "Mathe-Spiel bereit", sub: "Dieses Spiel läuft in der kostenlosen App MatheSnack. Ohne Konto, ohne Anmeldung.",
    open: "In MatheSnack öffnen", ios: "Im App Store laden", android: "Bei Google Play laden",
    soon: "MatheSnack erscheint bald im App Store und bei Google Play.",
    codeLabel: "Oder in der App „Code eingeben“ antippen:", bad: "Dieser Link ist unvollständig. Bitte den QR-Code noch einmal scannen.",
    plainTitle: "MatheSnack", plainSub: "Kurze Mathe-Spiele zum Stundenbeginn – per QR-Code.",
    privacy: "Datenschutz", imprint: "Impressum", pPage: "../datenschutz.html", iPage: "../impressum.html"
  },
  en: {
    title: "Maths game ready", sub: "This game runs in the free MatheSnack app. No account, no sign-up.",
    open: "Open in MatheSnack", ios: "Get it on the App Store", android: "Get it on Google Play",
    soon: "MatheSnack is coming soon to the App Store and Google Play.",
    codeLabel: "Or tap “Enter code” in the app:", bad: "This link is incomplete. Please scan the QR code again.",
    plainTitle: "MatheSnack", plainSub: "Quick maths games to start the lesson – via QR code.",
    privacy: "Privacy", imprint: "Legal notice", pPage: "../datenschutz-en.html", iPage: "../impressum-en.html"
  }
};
const lang = (navigator.language || "de").toLowerCase().startsWith("de") ? "de" : "en";
document.documentElement.lang = lang;
const T = TXT[lang];
const $ = id => document.getElementById(id);

const m = location.hash.match(/[#&]s=([0-9A-Za-z\-]+)/);
const code = m ? m[1].toUpperCase().replace(/-/g, "") : "";
const valid = /^[0-9A-HJKMNP-TV-Z]{15}$/.test(code);

$("privacy").textContent = T.privacy; $("privacy").href = T.pPage;
$("imprint").textContent = T.imprint; $("imprint").href = T.iPage;
if (!m) {
  $("title").textContent = T.plainTitle; $("sub").textContent = T.plainSub;
  $("open").hidden = true;
} else if (!valid) {
  $("title").textContent = T.plainTitle; $("sub").textContent = T.bad;
  $("open").hidden = true;
} else {
  $("title").textContent = T.title; $("sub").textContent = T.sub;
  $("open").textContent = T.open;
  $("open").href = "mathesnack://open#s=" + code;
  $("codeLabel").textContent = T.codeLabel;
  $("code").textContent = code.replace(/(.{5})(?=.)/g, "$1-");
  $("codeBox").hidden = false;
}
const isAndroid = /android/i.test(navigator.userAgent);
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
if (APP_STORE_URL && !isAndroid) { $("ios").href = APP_STORE_URL; $("ios").textContent = T.ios; $("ios").hidden = false; }
if (PLAY_URL && !isIOS) { $("android").href = PLAY_URL; $("android").textContent = T.android; $("android").hidden = false; }
if (!APP_STORE_URL && !PLAY_URL) { $("soon").textContent = T.soon; $("soon").hidden = false; }
/* Neuer Code im selben Tab (erneut gescannt): Seite neu auswerten */
window.addEventListener("hashchange", () => location.reload());
</script>
</body>
</html>
